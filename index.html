<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>funfern · wave playground</title>
  <!--
    Cross-origin isolation gate. The threaded bundle imports a shared memory,
    which every engine creates without isolation (Chrome, Firefox 148 and
    Safari 26 do; the SharedArrayBuffer global is what they hide), but it can
    hand that memory to the background worker pool only when the page is
    cross-origin isolated. Trunk's dev server, the Docker nginx configuration
    and any host that can set response headers isolate the page directly. On a
    header-less static host such as GitHub Pages, coi-serviceworker.js installs
    a worker that adds COOP/COEP to every response instead, which costs one
    reload. Parsing stops here so that reload does not throw away a partly
    downloaded module: Trunk injects its loader and a wasm preload further down
    this head, and the module is tens of megabytes. Where no worker registers -
    the browser or its settings refuse one, or it never activates - the page
    reloads once more marked `isolation=off` and runs without the pool, the
    preparation work on the main thread, as on iOS Safari. The marker lives in
    the address, not in storage: refused site storage is the usual reason a
    worker is refused. A browser with no service workers at all runs without
    the pool at once.

    This must stay above the data-trunk rust link below.
  -->
  <script>
    (function () {
      var flag = 'funfernCoiReload';
      var marker = 'isolation';
      var store = null;
      try { store = window.sessionStorage; } catch (e) { /* storage blocked */ }
      var note = function (text) {
        document.documentElement.innerHTML =
          '<head><meta charset="utf-8"><title>funfern</title></head>' +
          '<body style="margin:0;height:100vh;display:flex;flex-direction:column;' +
          'align-items:center;justify-content:center;gap:28px;background:#111820;' +
          'color:#93a7b8;font:14px/1.5 system-ui">' +
          '<img src="logo.svg" alt="funfern" style="width:min(60vw,460px);height:auto">' +
          '<p style="margin:0;max-width:46ch;text-align:center">' + text + '</p></body>';
      };

      if (window.crossOriginIsolated) {
        try { store && store.removeItem(flag); } catch (e) { /* ignore */ }
        return;
      }
      // Undefined rather than false means the browser has no notion of it.
      if (window.crossOriginIsolated !== false) return;
      // Nothing a service worker can do here; the app runs without its pool.
      if (!window.isSecureContext || !navigator.serviceWorker) return;
      // Back from a worker that would not register: run without the pool, and
      // give the address back as it was, so a link copied from it isolates
      // wherever it is opened.
      var params = new URLSearchParams(location.search);
      if (params.get(marker) === 'off') {
        params.delete(marker);
        var query = params.toString();
        history.replaceState(history.state, '',
          location.pathname + (query ? '?' + query : '') + location.hash);
        console.warn('funfern: no service worker could make this page cross-origin ' +
          'isolated, so it runs without its background worker pool.');
        return;
      }
      try {
        if (store && store.getItem(flag)) return;
        store && store.setItem(flag, '1');
      } catch (e) { /* ignore */ }

      window.stop();
      note('Enabling shared memory…');

      var settled = false;
      var runWithoutPool = function () {
        if (settled) return;
        settled = true;
        var url = new URL(location.href);
        url.searchParams.set(marker, 'off');
        location.replace(url.href);
      };
      // A registration that never activates must not leave the splash spinning.
      setTimeout(runWithoutPool, 10000);
      navigator.serviceWorker.register('coi-serviceworker.js')
        .then(function () { return navigator.serviceWorker.ready; })
        .then(function () { if (!settled) { settled = true; location.reload(); } })
        .catch(runWithoutPool);
    })();
  </script>
  <!--
    Safari's GPUDevice has no onuncapturederror attribute, only the event. wgpu
    hears a GPU error through the attribute, so there no error reached Bevy: it
    logged none and its error policy never ran, and a shader Safari rejected
    left the simulation silently still. Where the attribute is missing this
    gives it its specified meaning, the handler of the uncapturederror event.
  -->
  <script>
    (function () {
      if (!window.GPUDevice || 'onuncapturederror' in GPUDevice.prototype) return;
      var handlers = new WeakMap();
      Object.defineProperty(GPUDevice.prototype, 'onuncapturederror', {
        configurable: true,
        enumerable: true,
        get: function () { return handlers.get(this) || null; },
        set: function (handler) {
          var device = this;
          if (!handlers.has(device)) {
            device.addEventListener('uncapturederror', function (event) {
              var current = handlers.get(device);
              if (typeof current === 'function') current.call(device, event);
            });
          }
          handlers.set(device, typeof handler === 'function' ? handler : null);
        },
      });
    })();
  </script>
  <!--
    Whether the main thread sees a worker's growth of a shared memory. iOS
    Safari 26.2 does not for memory.fill and memory.copy: from WebKit bug 298743
    (September 2025) each thread checks them against its own cached size, which
    only that thread's growth refreshes, until the multi-memory work of bug
    277743 (March 2026) went back to the memory's size. The background pool's
    workers grow the memory as they start, and the main thread's next memcpy
    into the new pages then traps inside the allocator, which is holding its
    lock, so every later allocation spins and the page freezes on its splash.
    This runs that sequence on a two-page memory; the app starts its pool only
    where the check passes, and otherwise runs its work on the main thread.
    `?e2e-pool=off` makes it report what that Safari gets, so the end-to-end
    fixtures run the main-thread path anywhere.
  -->
  <script>
    window.funfernSharedMemoryGrowthVisible = (function () {
      // Each refusal says why, once: the app turns the pool off on any of them.
      var refuse = function (reason) {
        console.warn('funfern: ' + reason + ', so the background pool stays off and its work runs on the main thread');
        return false;
      };
      if (new URLSearchParams(location.search).get('e2e-pool') === 'off') {
        return Promise.resolve(refuse('?e2e-pool=off asks for the main-thread path'));
      }
      // The isolation gate above says so where it gives up on isolating.
      if (!window.crossOriginIsolated) {
        return Promise.resolve(false);
      }
      if (!window.Worker || typeof WebAssembly !== 'object') {
        return Promise.resolve(refuse('this browser has no workers or no WebAssembly'));
      }
      var worker, url, fill, module, memory;
      try {
        // (import "env" "memory" (memory 1 2 shared))
        // (func (export "grow") (param i32) (result i32) local.get 0 memory.grow)
        // (func (export "fill") (param i32 i32 i32) local.get 0 local.get 1 local.get 2 memory.fill)
        module = new WebAssembly.Module(new Uint8Array([
          0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00, 0x01, 0x0c, 0x02, 0x60, 0x01, 0x7f, 0x01, 0x7f,
          0x60, 0x03, 0x7f, 0x7f, 0x7f, 0x00, 0x02, 0x10, 0x01, 0x03, 0x65, 0x6e, 0x76, 0x06, 0x6d, 0x65,
          0x6d, 0x6f, 0x72, 0x79, 0x02, 0x03, 0x01, 0x02, 0x03, 0x03, 0x02, 0x00, 0x01, 0x07, 0x0f, 0x02,
          0x04, 0x67, 0x72, 0x6f, 0x77, 0x00, 0x00, 0x04, 0x66, 0x69, 0x6c, 0x6c, 0x00, 0x01, 0x0a, 0x14,
          0x02, 0x06, 0x00, 0x20, 0x00, 0x40, 0x00, 0x0b, 0x0b, 0x00, 0x20, 0x00, 0x20, 0x01, 0x20, 0x02,
          0xfc, 0x0b, 0x00, 0x0b,
        ]));
        memory = new WebAssembly.Memory({ initial: 1, maximum: 2, shared: true });
        fill = new WebAssembly.Instance(module, { env: { memory: memory } }).exports.fill;
        url = URL.createObjectURL(new Blob([
          'onmessage = function (e) {' +
          '  new WebAssembly.Instance(e.data.module, { env: { memory: e.data.memory } }).exports.grow(1);' +
          '  postMessage(0);' +
          '};',
        ], { type: 'text/javascript' }));
        worker = new Worker(url);
      } catch (e) {
        return Promise.resolve(refuse('the check could not start its worker (' + e + ')'));
      }
      return new Promise(function (resolve) {
        var settle = function (visible) {
          clearTimeout(timer);
          worker.terminate();
          URL.revokeObjectURL(url);
          resolve(visible);
        };
        // A worker that never answers could not run the pool either, but a
        // slow or busy machine starts one late: in a Linux VM with its CPUs
        // three times over-subscribed the answer took 3.6 to 8.3 s, and five
        // seconds turned the pool off there. The app waits on this to start,
        // and the splash gives up at 30 s.
        var timer = setTimeout(function () {
          settle(refuse("the check's worker did not answer within 20 s"));
        }, 20000);
        worker.onerror = function () { settle(refuse("the check's worker failed")); };
        worker.onmessage = function () {
          try {
            fill(65536, 0, 65536);
            settle(true);
          } catch (e) {
            settle(refuse("this browser's main thread does not see a worker's growth of shared memory"));
          }
        };
        worker.postMessage({ module: module, memory: memory });
      });
    })();
  </script>
  <link data-trunk rel="copy-file" href="coi-serviceworker.js">
  <link data-trunk rel="copy-file" href="assets/logo.svg">
  <link data-trunk rel="rust" href="crates/funfern-app/Cargo.toml" data-bin="funfern-app">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #111820; color: #d8e4ee; font: 16px system-ui; }
    canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

    /* The app clears the hidden attribute path by setting it on #startup once
       its first frame is up, so the overlay fades instead of disappearing. */
    #startup {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: radial-gradient(60% 60% at 50% 42%, #16222e 0%, #111820 72%);
      transition: opacity .4s ease, visibility 0s;
    }
    #startup[hidden] {
      display: flex; opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .4s ease, visibility 0s .4s;
    }
    #startup img { width: min(60vw, 460px); height: auto; }
    #startup p { margin: 0; max-width: 46ch; text-align: center; color: #93a7b8; font-size: 14px; line-height: 1.5; }
    #startup-bar { width: min(60vw, 460px); height: 3px; border-radius: 2px; background: #1e2a36; overflow: hidden; }
    #startup-bar div { width: 30%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, transparent, #4f9ed6, transparent); animation: startup-sweep 1.5s ease-in-out infinite; }
    @keyframes startup-sweep { from { transform: translateX(-120%); } to { transform: translateX(440%); } }
    #startup.failed #startup-bar { visibility: hidden; }
    #startup.failed p { color: #e6a8a8; }
    @media (prefers-reduced-motion: reduce) { #startup-bar div { animation: none; width: 100%; opacity: .45; } }
  </style>
</head>
<body>
  <canvas id="funfern" tabindex="0" aria-label="Spline geometry editor"></canvas>
  <div id="startup" role="status" aria-live="polite">
    <img src="logo.svg" alt="funfern">
    <div id="startup-bar"><div></div></div>
    <p id="startup-status">Starting funfern… WebGPU is required.</p>
  </div>
  <script>
    const startup = document.getElementById('startup');
    const statusLine = document.getElementById('startup-status');
    let failed = false;
    const running = () => !failed && !startup.hidden;
    // The app hides this once it runs, so an error that finds it hidden stopped
    // a running app rather than its start. A wasm trap there is most often an
    // allocation the memory could no longer grow for.
    const fail = detail => {
      const started = !failed && startup.hidden;
      failed = true;
      startup.hidden = false;
      startup.classList.add('failed');
      statusLine.textContent = started
        ? 'funfern stopped' + (/unreachable/.test(detail) ? ', most likely out of memory' : '') + '. Reload the page to start again. ' + detail
        : 'Unable to start WebGPU. Use a WebGPU-capable browser with hardware acceleration on, over HTTPS or localhost. ' + detail;
    };
    // The app's own way to say it stopped: a lost GPU device, or a rendering
    // error, told in this overlay's words (src/stopped.rs).
    window.funfernStopped = fail;
    if (!navigator.gpu) fail('This browser does not expose navigator.gpu.');
    addEventListener('error', e => fail(e.message));
    addEventListener('unhandledrejection', e => fail(String(e.reason)));
    setTimeout(() => { if (running()) statusLine.textContent = 'Loading the simulation module. The first visit downloads it in full; later ones come from the browser cache.'; }, 6000);
    setTimeout(() => { if (running()) fail('GPU initialization has not completed. Check the browser console for details.'); }, 30000);
  </script>
</body>
</html>
