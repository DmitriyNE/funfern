[workspace]
members = ["crates/funfern-core", "crates/funfern-app", "crates/funfern-protocol"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
# `cargo kani` builds with `cfg(kani)`; the proofs live behind it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
