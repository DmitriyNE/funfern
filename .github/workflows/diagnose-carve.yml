name: Diagnose welded baffle carve

on:
  push:
    branches: [diagnose-carve]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.96.1

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-diagnose-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: CPU
        run: grep -m1 "model name" /proc/cpuinfo; grep -m1 -o "\bfma\b" /proc/cpuinfo || true

      - name: Diagnose (debug)
        run: cargo test -p funfern-app --locked --lib diagnose_welded_baffle_carve -- --ignored --nocapture

      - name: Failing test (debug)
        run: cargo test -p funfern-app --locked --lib moving_a_welded_baffle_repairs_by_carving -- --nocapture || true
