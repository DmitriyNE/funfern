name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A fresh checkout has nothing to reuse incrementally, and the data would
  # only enlarge the build caches.
  CARGO_INCREMENTAL: 0
  RUST_VERSION: 1.96.1
  WEB_RUST_VERSION: nightly-2026-05-28
  TRUNK_VERSION: 0.22.0-beta.5

# Each job caches its compiled dependencies under a key naming everything that
# decides them, and restores only an exact match: a saved cache is one clean
# build and never grows, and a changed lockfile or toolchain costs one cold run.
# Caches are saved from main alone, after the build and before the tests, so a
# failing test does not leave the next run without them.

jobs:
  native:
    name: Check and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --target wasm32-unknown-unknown \
            --no-self-update
          rustup default "$RUST_VERSION"

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          # The same paths as the save step below.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Clippy on the end-to-end fixtures
        # The app's e2e feature (src/ui/e2e.rs), natively and for the browser,
        # which no other step lints. The fixtures run in the device job below,
        # in scripts/device-suite.sh and in browser-tests/e2e.spec.mjs.
        run: |
          cargo clippy -p funfern-app --bins --features e2e --locked -- -D warnings
          cargo clippy -p funfern-app --bins --target wasm32-unknown-unknown --features e2e --locked -- -D warnings

      - name: Build tests
        # Release, as the local checks run them: the gallery's scene tests
        # simulate seconds of a wave, which in a debug build took the step
        # from 9 to over 45 minutes, and the optimized arithmetic is what
        # ships.
        run: cargo test --workspace --release --locked --no-run

      - name: Build native release
        run: cargo build --release -p funfern-app --locked

      - name: Save build cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Run tests
        run: cargo test --workspace --release --locked

  web:
    name: Browser bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install threaded browser toolchain
        run: |
          rustup toolchain install "$WEB_RUST_VERSION" \
            --profile minimal \
            --component rust-src \
            --target wasm32-unknown-unknown \
            --no-self-update

      # -Zbuild-std compiles std from these sources as path crates, which cargo
      # checks by modification time. A fresh install dates them now, so the
      # cached std would rebuild, and with it every crate above it. The cache
      # key names the exact toolchain, so their contents never change under it.
      - name: Pin the std sources' timestamps
        run: |
          find "$(rustc +"$WEB_RUST_VERSION" --print sysroot)/lib/rustlib/src/rust" \
            -exec touch -h -d '2000-01-01T00:00:00Z' {} +

      - name: Install Trunk
        working-directory: /tmp
        env:
          TRUNK_ARCHIVE: trunk-x86_64-unknown-linux-gnu.tar.gz
        run: |
          curl --fail --location --silent --show-error \
            --output "$TRUNK_ARCHIVE" \
            "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$TRUNK_ARCHIVE"
          curl --fail --location --silent --show-error \
            --output "$TRUNK_ARCHIVE.sha256" \
            "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$TRUNK_ARCHIVE.sha256"
          sed "s/$/  $TRUNK_ARCHIVE/" "$TRUNK_ARCHIVE.sha256" > checksums.txt
          sha256sum --check checksums.txt
          tar --extract --gzip --file "$TRUNK_ARCHIVE"
          sudo install trunk /usr/local/bin/trunk
          trunk --version

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          # The same paths as the save step below. Trunk keeps the
          # wasm-bindgen and wasm-opt it downloads in ~/.cache/trunk.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/trunk/
            target/
          key: web-${{ runner.os }}-${{ env.WEB_RUST_VERSION }}-${{ env.TRUNK_VERSION }}-${{ hashFiles('Cargo.lock', 'scripts/trunk', 'Trunk.toml') }}

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6

      - name: Build browser release
        # Pages cannot send the cross-origin isolation headers the threaded
        # bundle's worker pool needs, so the page installs coi-serviceworker to
        # add them and the threaded bundle is what gets published. Off main no Pages base
        # path is set, and the bundle is built for the site root.
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_path }}/
          # What the bundle says it was built from (build.rs), which a browser
          # run holds the page it loads to.
          FUNFERN_BUILD_ID: ${{ github.sha }}
        run: |
          scripts/trunk build --release --locked --public-url "$PUBLIC_URL"
          echo "Built $FUNFERN_BUILD_ID"

      - name: Save build cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/trunk/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  kani:
    name: Protocol proofs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prove the runtime protocol
        # The runtime's generation protocol as a small state machine
        # (crates/funfern-protocol), every sequence of its steps checked to
        # the depths its proofs name. The runtime tests hold the real runtime
        # to the same machine, so a proof here is about the app's. Kani is
        # pinned to the version the proofs were last checked with locally.
        uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: '0.67.0'
          args: '-p funfern-protocol'

  device:
    name: Device fixtures on software Vulkan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies, lavapipe and a virtual display
        # The runtime X libraries are the ones winit opens; the build needs
        # only the headers above them.
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers \
            libvulkan1 \
            xvfb \
            xauth \
            libxcursor1 \
            libxrandr2 \
            libxi6 \
            libx11-xcb1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          # The same paths as the save step below.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: device-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Build the app with its end-to-end fixtures
        run: cargo build -p funfern-app --release --locked --features e2e --bin funfern-app

      - name: Save build cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Run the fixtures on lavapipe
        # The app as it ships, driven through its own handlers, on Mesa's
        # software Vulkan: the shaders, the render graph and the runtime on a
        # second backend, judged against the f64 reference. Each run must
        # report lavapipe's adapter, so a runner without it fails rather than
        # passing on nothing. Lavapipe flushes subnormals to zero, which is how
        # it found the nonlinear inverse's convergence tests unreachable near
        # zero, where the Metal device never noticed.
        run: scripts/e2e-lavapipe.sh

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # The protocol's decisions are the app's own code, so a proof that fails
    # holds the deploy as a failing test does, and so does a fixture that
    # fails on the second backend.
    needs: [native, web, kani, device]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
