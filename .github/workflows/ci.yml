name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the browser fixtures in full on SwiftShader, the long physics
  # and adaptation runs, the full invariants and wall sweep, the device long
  # runs on lavapipe, and the mutations in four shards. A manual run with
  # `nightly` set runs the same, when a fix should not wait for the schedule.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Run the nightly's jobs, as the schedule does, in place of the per-push ones"
        type: boolean
        default: false
      browser:
        description: "Browser fixtures on SwiftShader: the cavity alone, or every fixture isolated and with service workers refused"
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A fresh checkout has nothing to reuse incrementally, and the data would
  # only enlarge the build caches.
  CARGO_INCREMENTAL: 0
  RUST_VERSION: 1.96.1
  WEB_RUST_VERSION: nightly-2026-05-28
  TRUNK_VERSION: 0.22.0-beta.5

# Each job caches its compiled dependencies under a key naming everything that
# decides them, and restores only an exact match: a saved cache is one clean
# build and never grows, and a changed lockfile or toolchain costs one cold run.
# Caches are saved from main alone, after the build and before the tests, so a
# failing test does not leave the next run without them.

jobs:
  native:
    name: Check and test
    if: github.event_name != 'schedule' && !inputs.nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --target wasm32-unknown-unknown \
            --no-self-update
          rustup default "$RUST_VERSION"

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          # The same paths as the save step below.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Clippy for the browser
        # The app's browser-only code, which no other step lints; both
        # binaries, the shipped app and the fixtures one.
        run: cargo clippy -p funfern-app --bins --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Build tests
        # Release, as the local checks run them: the gallery's scene tests
        # simulate seconds of a wave, which in a debug build took the step
        # from 9 to over 45 minutes, and the optimized arithmetic is what
        # ships.
        run: cargo test --workspace --release --locked --no-run

      - name: Build native release
        run: cargo build --release -p funfern-app --locked

      - name: Save build cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Run tests
        run: cargo test --workspace --release --locked

      # A debug build panics on an integer overflow a release build wraps, as
      # the trace eigensolve's seed did for every scene with a second-order
      # outgoing wall (NUM-8 of the 2026-10-20 review).
      - name: Prepare the default scene in the debug profile
        run: cargo test -p funfern-core --test default_scene --locked

  # Nightly: the wall sweep over every gallery scene, the five arrays of one
  # obstacle included, which carry two thirds of its cases and stay out of
  # the gate (crates/funfern-app/tests/wall_sweep.rs).
  wall-sweep:
    name: Wall sweep, every scene
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --no-self-update
          rustup default "$RUST_VERSION"

      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Sweep every scene at the Coarse preset
        env:
          FUNFERN_WALL_SWEEP_ALL: 1
        run: cargo test --release -p funfern-app --test wall_sweep --locked -- --nocapture

      - name: Sweep every scene at the slider's coarsest reach
        env:
          FUNFERN_WALL_SWEEP_ALL: 1
          FUNFERN_WALL_SWEEP_EDGE: 0.25
        run: cargo test --release -p funfern-app --test wall_sweep --locked -- --nocapture

  # Nightly: IV-04 carries every linear gallery scene through a shift, a
  # quarter turn and a mirror, and the scenes whose contents may turn through
  # a turn by 37°, and IV-09 reads each against its curves rewritten, at
  # three levels; IV-08 and IV-10 to IV-12 run every case. The gate carries
  # a set of each (crates/funfern-app/tests/invariants.rs).
  invariants:
    name: Invariants, every scene
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --no-self-update
          rustup default "$RUST_VERSION"

      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Every invariant case
        env:
          FUNFERN_INVARIANTS_ALL: 1
        run: cargo test --release -p funfern-app --test invariants --locked -- --nocapture

  # Nightly: AMR-03's long adaptive runs at full length beside the fine
  # and the coarse run: eight experiments struck one after another, the
  # packet in the reflecting box, the driven source and the parametric
  # fiber for a minute, the fiber alone about an hour on an M1 Max. The gate
  # runs the first three for 20-24 s, the adapted run alone
  # (crates/funfern-app/tests/adaptation.rs).
  adaptation-long-runs:
    name: Adaptation, long runs
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --no-self-update
          rustup default "$RUST_VERSION"

      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: AMR-03 at full length
        env:
          FUNFERN_AMR_LONG: 1
        run: >-
          cargo test --release -p funfern-app --test adaptation --locked --
          --nocapture
          one_experiment_after_another
          a_settled_mesh_stops_asking
          a_packet_in_a_reflecting_box

  # Nightly: PH-04, the first- and second-order walls' reflection against
  # their law at 0°, 45° and 75° on three meshes, held to steady state; about
  # 57 minutes on an M1 Max, 75° on the finest mesh alone 27, so longer here
  # (crates/funfern-app/src/topology_examples.rs,
  # planar_reflection_converges_to_its_law_at_three_angles).
  planar-reflection:
    name: Planar reflection, three angles
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
