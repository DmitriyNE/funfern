  manufactured-solutions:
    name: Manufactured solutions, PH-19
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --no-self-update
          rustup default "$RUST_VERSION"

      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Manufactured solutions, PH-19
        run: >-
          cargo test --release -p funfern-app --test manufactured --locked --
          --ignored --nocapture manufactured_solutions_converge_on_the_finest_mesh

  # Nightly: the mutations, one deliberate defect each, applied and reverted
  # by scripts/mutations.sh; each must be caught by the test its manifest
  # names, at the check it targets. The device ones run their fixture on
  # lavapipe through scripts/e2e-fixture.sh. In four shards, every fourth
  # mutation each: one after another the 143 of 2026-11-15 take about nine
  # hours, and the runner stopped them at six every night from 2026-11-09.
  mutations:
    name: Mutations are detected (${{ matrix.shard }} of 4)
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies, lavapipe and a virtual display
        # And ffmpeg, which the `observers` fixture records through.
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers \
            libvulkan1 \
            xvfb \
            xauth \
            libxcursor1 \
            libxrandr2 \
            libxi6 \
            libx11-xcb1 \
            ffmpeg

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"

      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: device-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Build the fixtures binary
        run: cargo build -p funfern-app --release --locked --bin funfern-fixtures

      - name: Run this shard's mutations
        env:
          MUTATION_SHARD: ${{ matrix.shard }}/4
        run: scripts/mutations.sh

      # A failed shard keeps each mutation's runs, before and after its
      # patch: on 2026-11-16 a fixture that failed before its patch left
      # nothing to read but its verdict.
      - name: Keep the mutations' logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutations-${{ matrix.shard }}-logs
          path: target/mutations/
          retention-days: 14

  # Nightly: C9's long runs on the device. PH-01's cavity for 200,000 steps
  # on lavapipe against f64, mechanical with the grid filter and without,
  # and TM: the clock, each mode's phase and amplitude, the stationary flux,
  # the energy and the sum of Q
  # (crates/funfern-app/examples/canonical_gpu_cavity_drift.rs); the device
  # suite runs the unfiltered one on hardware. And the app run on, the
  # `endurance` fixture: one adaptive scene counted every 1,800 frames, six
  # times, each count what the one before held (src/ui/e2e/lifecycle.rs).
  device-long-runs:
    name: Device long runs on software Vulkan
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies, lavapipe and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers \
            libvulkan1 \
            xvfb \
            xauth \
            libxcursor1 \
            libxrandr2 \
            libxi6 \
            libx11-xcb1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"

      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: device-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Mechanical, unfiltered
        env:
          FIXTURE_TIMEOUT: 1700
        run: scripts/e2e-fixture.sh --example canonical_gpu_cavity_drift

      - name: Mechanical, under the grid filter
        if: success() || failure()
        env:
          FIXTURE_TIMEOUT: 1700
        run: scripts/e2e-fixture.sh --example canonical_gpu_cavity_drift --filter

      - name: TM, unfiltered
        if: success() || failure()
        env:
          FIXTURE_TIMEOUT: 1700
        run: scripts/e2e-fixture.sh --example canonical_gpu_cavity_drift --physics tm

      - name: The app run on, its resources counted
        if: success() || failure()
        env:
          FIXTURE_TIMEOUT: 5400
        run: scripts/e2e-fixture.sh endurance

  web:
    name: Browser bundle
    if: github.event_name != 'schedule' && !inputs.nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install threaded browser toolchain
        run: |
          rustup toolchain install "$WEB_RUST_VERSION" \
            --profile minimal \
            --component rust-src \
            --target wasm32-unknown-unknown \
            --no-self-update

      # -Zbuild-std compiles std from these sources as path crates, which cargo
      # checks by modification time. A fresh install dates them now, so the
      # cached std would rebuild, and with it every crate above it. The cache
      # key names the exact toolchain, so their contents never change under it.
      - name: Pin the std sources' timestamps
        run: |
          find "$(rustc +"$WEB_RUST_VERSION" --print sysroot)/lib/rustlib/src/rust" \
            -exec touch -h -d '2000-01-01T00:00:00Z' {} +

      - name: Install Trunk
        working-directory: /tmp
        env:
          TRUNK_ARCHIVE: trunk-x86_64-unknown-linux-gnu.tar.gz
        run: |
          curl --fail --location --silent --show-error \
            --output "$TRUNK_ARCHIVE" \
            "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$TRUNK_ARCHIVE"
          curl --fail --location --silent --show-error \
            --output "$TRUNK_ARCHIVE.sha256" \
            "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$TRUNK_ARCHIVE.sha256"
          sed "s/$/  $TRUNK_ARCHIVE/" "$TRUNK_ARCHIVE.sha256" > checksums.txt
          sha256sum --check checksums.txt
          tar --extract --gzip --file "$TRUNK_ARCHIVE"
          sudo install trunk /usr/local/bin/trunk
          trunk --version

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          # The same paths as the save step below. Trunk keeps the
          # wasm-bindgen and wasm-opt it downloads in ~/.cache/trunk.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/trunk/
            target/
          key: web-${{ runner.os }}-${{ env.WEB_RUST_VERSION }}-${{ env.TRUNK_VERSION }}-${{ hashFiles('Cargo.lock', 'scripts/trunk', 'Trunk.toml') }}

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6

      - name: Build browser release
        # Pages cannot send the cross-origin isolation headers the threaded
        # bundle's worker pool needs, so the page installs coi-serviceworker to
        # add them and the threaded bundle is what gets published. Off main no Pages base
        # path is set, and the bundle is built for the site root.
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_path }}/
          # What the bundle says it was built from (build.rs), which a browser
          # run holds the page it loads to.
          FUNFERN_BUILD_ID: ${{ github.sha }}
        run: |
          scripts/trunk build --release --locked --public-url "$PUBLIC_URL"
          echo "Built $FUNFERN_BUILD_ID"

      - name: Save build cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/trunk/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  kani:
    name: Protocol proofs
    if: github.event_name != 'schedule' && !inputs.nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prove the runtime protocol
        # The runtime's generation protocol as a small state machine
        # (crates/funfern-protocol), every sequence of its steps checked to
        # the depths its proofs name. The runtime tests hold the real runtime
        # to the same machine, so a proof here is about the app's. Kani is
        # pinned to the version the proofs were last checked with locally.
        uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: '0.67.0'
          args: '-p funfern-protocol'

  device:
    name: Device fixtures on software Vulkan
    if: github.event_name != 'schedule' && !inputs.nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies, lavapipe and a virtual display
        # The runtime X libraries are the ones winit opens; the build needs
        # only the headers above them. ffmpeg is what the `observers`
        # fixture records through.
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers \
            libvulkan1 \
            xvfb \
            xauth \
            libxcursor1 \
            libxrandr2 \
            libxi6 \
            libx11-xcb1 \
            ffmpeg

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          # The same paths as the save step below.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: device-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Build the fixtures binary
        run: cargo build -p funfern-app --release --locked --bin funfern-fixtures

      - name: Save build cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Run the fixtures on lavapipe
        # The app as it ships, driven through its own handlers, on Mesa's
        # software Vulkan: the shaders, the render graph and the runtime on a
        # second backend, judged against the f64 reference. Each run must
        # report lavapipe's adapter, so a runner without it fails rather than
        # passing on nothing. Lavapipe flushes subnormals to zero, which is how
        # it found the nonlinear inverse's convergence tests unreachable near
        # zero, where the Metal device never noticed.
        run: scripts/e2e-lavapipe.sh

      - name: Keep the fixtures' logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lavapipe-fixture-logs
          path: target/e2e-lavapipe/*.log
          retention-days: 14

  browser:
    name: Browser fixtures on SwiftShader (${{ matrix.hosting }}${{ matrix.part != 'state' && format(', {0}', matrix.part) || '' }}${{ matrix.start == 'warm' && ', warm' || '' }})
    # The app's end-to-end fixtures in Chromium on its bundled software WebGPU:
    # the shipped bundle with its fixtures, started in a browser that compiles
    # its shaders through Tint and draws them through its compositor. Every
    # push runs the cavity alone, isolated, a smoke check of that wiring, since
    # SwiftShader compiles the app's pipelines for a minute a page and runs a
    # few frames a second; nightly, and dispatched with `full`, every fixture
    # runs, isolated and with service workers refused, the two in parallel.
    # The fixtures are split into parts that run in parallel, since the slower
    # hosting's state part alone takes 3 h 52 min to 5 h 54 min (2026-10-17 to
    # 2026-10-20), close to the runner's six hours. Served as Pages each page
    # runs cold and then warm, twice its time:
    # - recorders: `observables` and `handoff-memory-running-late`, about
    #   three and a half hours served as Pages;
    # - far-field: `far-field` and `far-field-late`, about two and a half,
    #   split from the recorders when the four together reached the six hours
    #   (VER-1 of the 2026-10-20 review);
    # - handoffs: the handoffs added on 2026-10-20 and after,
    #   `handoff-driven`, `handoff-driven-pins` and `handoff-memory-flux`, and
    #   `neutral-remesh`, whose 34,014 and 70,218 nodes are three and six times
    #   the cavity's, `baffle-move`, whose 33,938 run 512 steps, and
    #   `separator-mid-run`, whose 33,819 are remeshed twice;
    # - memory: stage A1's `handoff-memory-rebuild`, `-remesh`, `-edit`,
    #   `-timestep` and `-running`. The same commit's state part ran past 340
    #   minutes on 2026-10-26 and 27 and took 3 h 15 min on the 28th: on a
    #   slow runner every page takes twice its time, and these five took
    #   3 h 45 min of it;
    # - invariants: stage C4's `observers`, the cavity twice, its second run
    #   recording, paused and resized, and `superposition`, the walled cavity
    #   four times, stage C5's `similarity`, the walled cavity twice,
    #   RT-04's `events` and `events-handoff`, the switchable cavity once each,
    #   and RT-05's `rollback` and `rollback-handoff`, the switchable cavity
    #   and the cavity once each;
    # - batches-1 to -4, -5a and -5b: RT-02's `batches`, a gallery scene six
    #   times a page, the page's `e2e-scene=` naming which: the five on one
    #   page never finished in the six hours, Spatial soliton alone taking 33
    #   minutes on an M1 Max's SwiftShader (2026-11-15). The double slit's
    #   six, about half an hour each on CI's (48 minutes served without the
    #   pool), go over two pages by `e2e-schedules=`, the first schedule on
    #   both (2026-11-16);
    # - clock: C8.3's `clock-retimes`, the walled cavity handed over eight
    #   times, and `clock-retime-at-rebase` and `-across-rebase`, kept out of
    #   the state part, which runs close to its limit;
    # - lifecycle-1 to -5: C8.4's `lifecycle`, a gallery scene cycled twice a
    #   page, remeshed and adapting: on CI's SwiftShader the soliton's first
    #   cycle took 73 minutes (2026-11-14);
    # - preparation: C8.5's `preparation`, whose replacing part runs on a
    #   page, the frames part judging native frames alone;
    # - state: the rest, but the adaptive loop's `adaptive` and
    #   `adaptive-slow`, which run in no part: their f64 reference follows the
    #   run on a thread of its own natively, and on the page would step inside
    #   its frames, setting the pace it is there to judge. RT-01's
    #   `interleaved-<seed>` runs are left out for the same reason, by the
    #   spec itself.
    # Served without the worker pool, a page starts cold and warm in cells of
    # their own (`start`): lifecycle's ring resonator took 1.8 hours cold and
    # ran out of its time warm in one cell (2026-11-16).
    # A cell that runs long fails at 340 minutes, before the runner's own
    # cancel, so it reports which page it stood at.
    timeout-minutes: 340
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        hosting: ${{ fromJSON((github.event_name == 'schedule' || inputs.nightly || inputs.browser == 'full') && '["isolated", "pages-blocked"]' || '["isolated"]') }}
        part: ${{ fromJSON((github.event_name == 'schedule' || inputs.nightly || inputs.browser == 'full') && '["state", "edges", "memory", "recorders", "far-field", "handoffs", "invariants", "clock", "preparation", "batches-1", "batches-2", "batches-3", "batches-4", "batches-5a", "batches-5b", "lifecycle-1", "lifecycle-2", "lifecycle-3", "lifecycle-4", "lifecycle-5"]' || '["state"]') }}
        start: ${{ fromJSON((github.event_name == 'schedule' || inputs.nightly || inputs.browser == 'full') && '["cold", "warm"]' || '["cold"]') }}
        exclude:
          - hosting: isolated
            start: warm
    env:
      FULL: ${{ github.event_name == 'schedule' || inputs.nightly || inputs.browser == 'full' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install threaded browser toolchain
        run: |
          rustup toolchain install "$WEB_RUST_VERSION" \
            --profile minimal \
            --component rust-src \
            --target wasm32-unknown-unknown \
            --no-self-update

      # -Zbuild-std compiles std from these sources as path crates, which cargo
      # checks by modification time. A fresh install dates them now, so the
      # cached std would rebuild, and with it every crate above it. The cache
      # key names the exact toolchain, so their contents never change under it.
      - name: Pin the std sources' timestamps
        run: |
          find "$(rustc +"$WEB_RUST_VERSION" --print sysroot)/lib/rustlib/src/rust" \
            -exec touch -h -d '2000-01-01T00:00:00Z' {} +

      - name: Install Trunk
        working-directory: /tmp
        env:
          TRUNK_ARCHIVE: trunk-x86_64-unknown-linux-gnu.tar.gz
        run: |
          curl --fail --location --silent --show-error \
            --output "$TRUNK_ARCHIVE" \
            "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$TRUNK_ARCHIVE"
          curl --fail --location --silent --show-error \
            --output "$TRUNK_ARCHIVE.sha256" \
            "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$TRUNK_ARCHIVE.sha256"
          sed "s/$/  $TRUNK_ARCHIVE/" "$TRUNK_ARCHIVE.sha256" > checksums.txt
          sha256sum --check checksums.txt
          tar --extract --gzip --file "$TRUNK_ARCHIVE"
          sudo install trunk /usr/local/bin/trunk
          trunk --version

      - name: Restore build cache
        # The web job's, read and never saved here: the fixtures binary is
        # the app's own crate alone, so everything under it is reused.
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/trunk/
            target/
          key: web-${{ runner.os }}-${{ env.WEB_RUST_VERSION }}-${{ env.TRUNK_VERSION }}-${{ hashFiles('Cargo.lock', 'scripts/trunk', 'Trunk.toml') }}

      - name: Build the browser bundle of the fixtures binary
        env:
          FUNFERN_BUILD_ID: ${{ github.sha }}
        run: |
          scripts/fixtures-page.sh
          scripts/trunk build fixtures.html --release --locked --dist dist-e2e

      - name: Install Playwright's Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the fixtures on SwiftShader
        # Served at the site root, under the isolation headers or without them
        # and with service workers refused, where the page runs without its
        # pool; each page must be this commit's build on SwiftShader's adapter.
        # A page's deadline is about twice the runner's: the cavity took 237 s,
        # and the slowest page, cavity-batches' four runs, 745 s.
        env:
          FUNFERN_EXPECT_BUILD: ${{ github.sha }}
          FUNFERN_E2E_FIXTURES: ${{ env.FULL != 'true' && 'cavity' || matrix.part == 'memory' && 'handoff-memory-rebuild,handoff-memory-remesh,handoff-memory-edit,handoff-memory-timestep,handoff-memory-running' || matrix.part == 'recorders' && 'observables,handoff-memory-running-late' || matrix.part == 'far-field' && 'far-field,far-field-late' || matrix.part == 'handoffs' && 'handoff-driven,handoff-driven-pins,handoff-memory-flux,neutral-remesh,baffle-move,separator-mid-run' || matrix.part == 'invariants' && 'observers,superposition,similarity,events,events-handoff,rollback,rollback-handoff' || startsWith(matrix.part, 'batches-') && 'batches' || matrix.part == 'clock' && 'clock-retimes,clock-retime-at-rebase,clock-retime-across-rebase' || startsWith(matrix.part, 'lifecycle-') && 'lifecycle' || matrix.part == 'preparation' && 'preparation' || matrix.part == 'edges' && 'edges' || '' }}
          FUNFERN_E2E_EXCLUDE: ${{ env.FULL == 'true' && matrix.part == 'state' && 'observables,far-field,far-field-late,handoff-memory-running-late,handoff-driven,handoff-driven-pins,handoff-memory-flux,neutral-remesh,baffle-move,separator-mid-run,observers,superposition,similarity,handoff-memory-rebuild,handoff-memory-remesh,handoff-memory-edit,handoff-memory-timestep,handoff-memory-running,batches,events,events-handoff,rollback,rollback-handoff,clock-retimes,clock-retime-at-rebase,clock-retime-across-rebase,lifecycle,preparation,edges,adaptive,adaptive-slow' || '' }}
          FUNFERN_E2E_DEADLINE: ${{ env.FULL != 'true' && '600' || '1500' }}
          FUNFERN_E2E_HOSTING: ${{ matrix.hosting }}
          FUNFERN_TEST_ISOLATED: ${{ matrix.hosting == 'isolated' && '1' || '0' }}
          FUNFERN_EXPECT_BROWSER_WORKER: ${{ matrix.hosting == 'isolated' && 'active' || 'unavailable' }}
          PART: ${{ matrix.part }}
          FUNFERN_E2E_START: ${{ matrix.hosting == 'isolated' && 'cold' || matrix.start }}
        # A part named for a scene runs that one of its fixture's scenes alone.
        run: |
          case "$PART" in
            batches-5a) export FUNFERN_E2E_QUERY="e2e-scene=5&e2e-schedules=1,2" ;;
            batches-5b) export FUNFERN_E2E_QUERY="e2e-scene=5&e2e-schedules=3,4,5" ;;
            batches-* | lifecycle-*) export FUNFERN_E2E_QUERY="e2e-scene=${PART##*-}" ;;
          esac
          npm run test:e2e:swiftshader

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'schedule' && !inputs.nightly
    # The protocol's decisions are the app's own code, so a proof that fails
    # holds the deploy as a failing test does, and so does a fixture that
    # fails on the second backend or in the browser.
    needs: [native, web, kani, device, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      # A slower, older run that reaches its deploy after a newer one has
      # deployed would publish over it, so only main's head deploys (VER-26
      # of the 2026-10-20 review). The concurrency group above orders the
      # deploys, so the head read here cannot race another deploy.
      - name: Check the commit is still main's head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $head; ${{ github.sha }} is not deployed"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy GitHub Pages
        if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
