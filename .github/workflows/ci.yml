            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Absorbing hole, PH-07
        run: >-
          cargo test --release -p funfern-app --lib --locked --
          --ignored --nocapture absorbing_holes_converge_to_their_law

  # Nightly: PH-09, the walls' transient response, the channel's pulses on
  # three meshes and the circle's in every case; seventeen minutes on an M1
  # Max, the two side by side (topology_examples.rs, transient_*).
  transient-walls:
    name: Transient walls, PH-09
    if: github.event_name == 'schedule' || inputs.nightly
