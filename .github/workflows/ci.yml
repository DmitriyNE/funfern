            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Reflect at three angles on three meshes
        run: >-
          cargo test --release -p funfern-app --lib --locked --
          --ignored --nocapture planar_reflection_converges_to_its_law_at_three_angles

  # Nightly: PH-06, a circular outgoing wall, both laws, kR 0.8 to 10 and
  # the angular orders that propagate, kR 5 and 10 on three meshes; each
  # reading at the production step and half of it (topology_examples.rs,
  # outgoing_circles_converge_to_their_law).
  outgoing-circle:
    name: Outgoing circle, PH-06
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
