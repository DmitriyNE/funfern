            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Transient walls, PH-09
        run: >-
          cargo test --release -p funfern-app --lib --locked --
          --ignored --nocapture transient_

  # Nightly: PH-11, planar interfaces against Fresnel in every skin, on
  # three meshes; forty-two minutes on an M1 Max (topology_examples.rs,
  # planar_interfaces_converge_to_fresnel).
  fresnel-interfaces:
