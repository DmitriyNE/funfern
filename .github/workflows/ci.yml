      # PH-18: the far-field recorder's twin against a line source's pattern,
      # alone and beside PH-12's cylinders; three minutes on an M1 Max.
      - name: Far field of a line source, PH-18
        run: >-
          cargo test --release -p funfern-app --lib --locked --
