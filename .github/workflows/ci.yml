            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Fresnel interfaces, PH-11
        run: >-
          cargo test --release -p funfern-app --lib --locked --
          --ignored --nocapture planar_interfaces_converge_to_fresnel

  # Nightly: PH-12, cylinders against the partial-wave series in every skin,
  # on three meshes and two curve tolerances; twenty-three minutes on an M1 Max
  # (topology_examples.rs, cylinders_converge_to_the_partial_waves).
  cylinder-scattering:
    name: Cylinder scattering, PH-12
