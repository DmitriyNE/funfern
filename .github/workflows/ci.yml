          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
