            --no-self-update
          rustup default "$RUST_VERSION"

      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Energy over long runs, PH-05, PH-17 and C9
        run: >-
          cargo test --release -p funfern-app --lib --locked --
          --ignored --nocapture long_run_

      - name: Uniform oscillators over long runs, C9
        if: success() || failure()
        run: >-
          cargo test --release -p funfern-core --lib --locked --
          --ignored --nocapture long_run_

  # Nightly: PH-07, an absorbing circular hole, the same cases
  # (topology_examples.rs, absorbing_holes_converge_to_their_law).
  absorbing-hole:
    name: Absorbing hole, PH-07
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
