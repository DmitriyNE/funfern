            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Outgoing circle, PH-06
        run: >-
          cargo test --release -p funfern-app --lib --locked --
          --ignored --nocapture outgoing_circles_converge_to_their_law

  # Nightly: PH-05 and PH-17 over long runs, the conservative media to a
  # thousand seconds, the passive ones and the walls to four hundred, Kerr's
  # known drift to 160; and C9's: the cavity's modes for a thousand seconds,
  # Kerr under the filter to a thousand, the bounded pumps for three hundred
  # periods, and the uniform oscillators that stay uniform for two thousand;
  # about ten minutes and one on an M1 Max
  # (crates/funfern-app/src/topology_examples.rs and
  # crates/funfern-core/src/canonical_temporal.rs, long_run_*).
