name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.96.0
  TRUNK_VERSION: 0.21.14

jobs:
  ci:
    name: Check and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --target wasm32-unknown-unknown \
            --no-self-update
          rustup default "$RUST_VERSION"

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Install Trunk
        working-directory: /tmp
        env:
          TRUNK_ARCHIVE: trunk-x86_64-unknown-linux-gnu.tar.gz
        run: |
          curl --fail --location --silent --show-error \
            --output "$TRUNK_ARCHIVE" \
            "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$TRUNK_ARCHIVE"
          curl --fail --location --silent --show-error \
            --output "$TRUNK_ARCHIVE.sha256" \
            "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$TRUNK_ARCHIVE.sha256"
          sed "s/$/  $TRUNK_ARCHIVE/" "$TRUNK_ARCHIVE.sha256" > checksums.txt
          sha256sum --check checksums.txt
          tar --extract --gzip --file "$TRUNK_ARCHIVE"
          sudo install trunk /usr/local/bin/trunk
          trunk --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build native release
        run: cargo build --release -p funfern-app --locked

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6

      - name: Build browser release
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: NO_COLOR=true trunk build --release --locked

      - name: Build browser release for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: NO_COLOR=true trunk build --release --locked --public-url "${{ steps.pages.outputs.base_path }}/"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
