[package]
name = "funfern-app"
description = "Bevy WebGPU geometry playground"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
funfern-core = { path = "../funfern-core" }
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_render", "bevy_camera", "bevy_window", "bevy_winit", "bevy_log", "multi_threaded", "webgpu", "x11", "wayland"] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rfd = { version = "0.17", features = ["file-handle-inner"] }
flate2 = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "History", "Location", "Storage"] }
