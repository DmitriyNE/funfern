[package]
name = "funfern-app"
description = "Bevy WebGPU geometry playground"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
browser-threads = ["dep:rayon", "dep:wasm-bindgen-rayon"]

[lints]
workspace = true

[dependencies]
funfern-core = { path = "../funfern-core" }
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_render", "bevy_camera", "bevy_window", "bevy_winit", "bevy_log", "multi_threaded", "webgpu", "x11", "wayland"] }
bevy_egui = { version = "=0.41.1", default-features = false, features = ["render", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rfd = { version = "0.17", features = ["file-handle-inner"] }
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
rayon = { version = "1.11", optional = true }
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }
web-sys = { version = "0.3", features = ["Blob", "Document", "Element", "History", "HtmlElement", "Location", "Storage", "Url", "Window"] }

[dev-dependencies]
# Pinned to the version wgpu links, so the parse a test does is the parse the
# app's own device does. Nothing in the workspace read the shaders before this:
# every edit was checked by hand against a throwaway crate.
naga = { version = "=29.0.4", features = ["wgsl-in"] }
