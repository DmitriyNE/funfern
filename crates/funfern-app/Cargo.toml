[package]
name = "funfern-app"
description = "Bevy WebGPU geometry playground"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
browser-threads = ["dep:rayon", "dep:wasm-bindgen-rayon"]

[lints]
workspace = true

[dependencies]
funfern-core = { path = "../funfern-core" }
# The runtime's protocol as a small state machine, which Kani checks and the
# runtime tests hold the real runtime to, and the decisions the runtime makes
# by it, which the model makes by the same functions.
funfern-protocol = { path = "../funfern-protocol" }
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_render", "bevy_camera", "bevy_window", "bevy_winit", "bevy_log", "multi_threaded", "webgpu", "x11", "wayland"] }
# `manage_clipboard` is what hands egui's copied text to the operating
# system. Without it `Context::copy_text` fills a buffer nothing reads and
# every Copy button is silently inert on native. Its dependencies are
# target-gated upstream: `arboard` excludes wasm, `smithay-clipboard` is
# Linux only, so the browser build is unaffected.
bevy_egui = { version = "=0.41.1", default-features = false, features = [
    "render",
    "default_fonts",
    "manage_clipboard",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rfd = { version = "0.17", features = ["file-handle-inner"] }
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
bytemuck = { version = "1", features = ["derive"] }
# The version Bevy links, for the timestamp queries `drawn_pacing` traces with,
# which Bevy does not re-export.
wgpu = { version = "=29.0.4", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
rayon = { version = "1.11", optional = true }
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }
web-sys = { version = "0.3", features = ["Blob", "console", "Document", "Element", "History", "HtmlElement", "Location", "Storage", "Url", "Window"] }

[dev-dependencies]
# Pinned to the version wgpu links, so the parse a test does is the parse the
# app's own device does. Nothing in the workspace read the shaders before this:
# every edit was checked by hand against a throwaway crate. `wgsl-out` is the
# rewrite wgpu hands a browser in place of the source.
naga = { version = "=29.0.4", features = ["wgsl-in", "wgsl-out"] }
# The version epaint links, to read egui's own font files: egui's glyph check
# calls a glyph the family's replacement face owns missing, and for the
# monospace family that face is the primary one.
ab_glyph = "=0.2.32"
# Generated sequences of user actions against a reference model of what owns
# the current value, with shrinking that keeps a shortened sequence legal.
proptest = "1.11"
proptest-state-machine = "0.8"
